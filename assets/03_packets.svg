<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" role="img">
<title>包组成行 行组成帧</title><desc>简化示意：具体封装与可选功能以传感器和接收器支持的规范版本为准。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#5b7690"/></marker></defs>
<rect width="1120" height="620" rx="16" fill="#f8fafc"/>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#17324d} .muted{fill:#526b82}</style>
<text x="36" y="48" font-size="28" text-anchor="start" font-weight="700" style="fill:#17324d">03  包组成行 行组成帧</text>
<text x="36" y="80" font-size="18" text-anchor="start" font-weight="400" style="fill:#526b82">简化示意：具体封装与可选功能以传感器和接收器支持的规范版本为准。</text>
<rect x="40" y="130" width="190" height="100" rx="12" fill="#eee9f8" stroke="#bacbda"/>
<text x="135.0" y="165" font-size="23" text-anchor="middle" font-weight="700" style="fill:#17324d">帧开始</text>
<text x="135.0" y="197" font-size="19" text-anchor="middle" font-weight="400" style="fill:#17324d">短包 / 帧边界</text>
<rect x="270" y="130" width="540" height="100" rx="12" fill="#e7f1fb" stroke="#bacbda"/>
<text x="540.0" y="165" font-size="23" text-anchor="middle" font-weight="700" style="fill:#17324d">多个图像长包</text>
<text x="540.0" y="197" font-size="19" text-anchor="middle" font-weight="400" style="fill:#17324d">有效载荷包含像素样本</text>
<rect x="850" y="130" width="230" height="100" rx="12" fill="#eee9f8" stroke="#bacbda"/>
<text x="965.0" y="165" font-size="23" text-anchor="middle" font-weight="700" style="fill:#17324d">帧结束</text>
<text x="965.0" y="197" font-size="19" text-anchor="middle" font-weight="400" style="fill:#17324d">短包 / 帧边界</text>
<path d="M230,180 L270,180" fill="none" stroke="#5b7690" stroke-width="2.5" marker-end="url(#arrow)" />
<path d="M810,180 L850,180" fill="none" stroke="#5b7690" stroke-width="2.5" marker-end="url(#arrow)" />
<rect x="80" y="300" width="250" height="120" rx="12" fill="#fff0d9" stroke="#bacbda"/>
<text x="205.0" y="335" font-size="23" text-anchor="middle" font-weight="700" style="fill:#17324d">包头</text>
<text x="205.0" y="367" font-size="19" text-anchor="middle" font-weight="400" style="fill:#17324d">数据类型 / VC</text>
<text x="205.0" y="394" font-size="19" text-anchor="middle" font-weight="400" style="fill:#17324d">包头 ECC</text>
<rect x="360" y="300" width="420" height="120" rx="12" fill="#e5f4ed" stroke="#bacbda"/>
<text x="570.0" y="335" font-size="23" text-anchor="middle" font-weight="700" style="fill:#17324d">Payload</text>
<text x="570.0" y="367" font-size="19" text-anchor="middle" font-weight="400" style="fill:#17324d">RAW10 / RAW12 / YUV…</text>
<text x="570.0" y="394" font-size="19" text-anchor="middle" font-weight="400" style="fill:#17324d">线侧布局与内存布局可不同</text>
<rect x="810" y="300" width="230" height="120" rx="12" fill="#fff0d9" stroke="#bacbda"/>
<text x="925.0" y="335" font-size="23" text-anchor="middle" font-weight="700" style="fill:#17324d">包尾</text>
<text x="925.0" y="367" font-size="19" text-anchor="middle" font-weight="400" style="fill:#17324d">载荷 CRC</text>
<path d="M330,360 L360,360" fill="none" stroke="#5b7690" stroke-width="2.5" marker-end="url(#arrow)" />
<path d="M780,360 L810,360" fill="none" stroke="#5b7690" stroke-width="2.5" marker-end="url(#arrow)" />
<text x="560" y="490" font-size="23" text-anchor="middle" font-weight="700" style="fill:#17324d">VC 是同一链路内的逻辑流标识；lane 是物理数据通道。</text>
<text x="36" y="595" font-size="18" text-anchor="start" font-weight="400" style="fill:#526b82">CRC/ECC 错误优先排查传输与时序；它们不是 MP4 或 RTSP 层的错误。</text>
</svg>