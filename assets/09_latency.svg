<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" role="img">
<title>延迟是一段段累积的</title><desc>图中长度仅表示处理顺序，不表示各段实测耗时。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#5b7690"/></marker></defs>
<rect width="1120" height="620" rx="16" fill="#f8fafc"/>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#17324d} .muted{fill:#526b82}</style>
<text x="36" y="48" font-size="28" text-anchor="start" font-weight="700" style="fill:#17324d">09  延迟是一段段累积的</text>
<text x="36" y="80" font-size="18" text-anchor="start" font-weight="400" style="fill:#526b82">图中长度仅表示处理顺序，不表示各段实测耗时。</text>
<rect x="40" y="175" width="190" height="120" rx="12" fill="#e5f4ed" stroke="#bacbda"/>
<text x="135.0" y="210" font-size="23" text-anchor="middle" font-weight="700" style="fill:#17324d">曝光与读出</text>
<text x="135" y="255" font-size="24" text-anchor="middle" font-weight="400" style="fill:#17324d">T1</text>
<path d="M230,235 L255,235" fill="none" stroke="#5b7690" stroke-width="2.5" marker-end="url(#arrow)" />
<rect x="255" y="175" width="190" height="120" rx="12" fill="#e7f1fb" stroke="#bacbda"/>
<text x="350.0" y="210" font-size="23" text-anchor="middle" font-weight="700" style="fill:#17324d">ISP 与缓存</text>
<text x="350" y="255" font-size="24" text-anchor="middle" font-weight="400" style="fill:#17324d">T2</text>
<path d="M445,235 L470,235" fill="none" stroke="#5b7690" stroke-width="2.5" marker-end="url(#arrow)" />
<rect x="470" y="175" width="190" height="120" rx="12" fill="#fff0d9" stroke="#bacbda"/>
<text x="565.0" y="210" font-size="23" text-anchor="middle" font-weight="700" style="fill:#17324d">编码与队列</text>
<text x="565" y="255" font-size="24" text-anchor="middle" font-weight="400" style="fill:#17324d">T3</text>
<path d="M660,235 L685,235" fill="none" stroke="#5b7690" stroke-width="2.5" marker-end="url(#arrow)" />
<rect x="685" y="175" width="190" height="120" rx="12" fill="#eee9f8" stroke="#bacbda"/>
<text x="780.0" y="210" font-size="23" text-anchor="middle" font-weight="700" style="fill:#17324d">网络</text>
<text x="780" y="255" font-size="24" text-anchor="middle" font-weight="400" style="fill:#17324d">T4</text>
<path d="M875,235 L900,235" fill="none" stroke="#5b7690" stroke-width="2.5" marker-end="url(#arrow)" />
<rect x="900" y="175" width="190" height="120" rx="12" fill="#e7f1fb" stroke="#bacbda"/>
<text x="995.0" y="210" font-size="23" text-anchor="middle" font-weight="700" style="fill:#17324d">解码与显示</text>
<text x="995" y="255" font-size="24" text-anchor="middle" font-weight="400" style="fill:#17324d">T5</text>
<text x="560" y="380" font-size="29" text-anchor="middle" font-weight="700" style="fill:#17324d">总延迟 ≈ T1 + T2 + T3 + T4 + T5</text>
<text x="560" y="450" font-size="26" text-anchor="middle" font-weight="700" style="fill:#17324d">30 fps 时，积压 10 帧的队列约增加 333 ms</text>
<text x="560" y="515" font-size="21" text-anchor="middle" font-weight="400" style="fill:#17324d">测量：同时记录现实中的计时器与播放屏幕，重复采样。</text>
<text x="36" y="595" font-size="18" text-anchor="start" font-weight="400" style="fill:#526b82">先检查本地积压，再调整网络；不要把 sync=false 当作通用优化。</text>
</svg>